name: DEV API Regression

on:
  workflow_dispatch:

jobs:
  api-regression-tests:
    name: DEV API Regression Tests
    runs-on: ubuntu-latest

    environment: DEV

    env:
      TEST_ENV: dev
      IDENTITY_BASE_URL: ${{ vars.IDENTITY_BASE_URL }}
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate DEV configuration
        shell: bash
        run: |
          if [ -z "$IDENTITY_BASE_URL" ]; then
            echo "::error::IDENTITY_BASE_URL is not configured."
            exit 1
          fi

          if [ -z "$TEST_EMAIL" ]; then
            echo "::error::TEST_EMAIL is not configured."
            exit 1
          fi

          if [ -z "$TEST_PASSWORD" ]; then
            echo "::error::TEST_PASSWORD is not configured."
            exit 1
          fi

          echo "DEV test configuration is available."

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: Run DEV API regression tests
        run: npm run test:api:regression:dev